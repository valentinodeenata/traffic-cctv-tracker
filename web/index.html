<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lalu Lintas Jabodetabek Live</title>
<meta name="description" content="Peta kondisi lalu lintas Jabodetabek dari CCTV publik. Jumlah kendaraan dihitung AI tiap 5 menit.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #ffffff; --bg-2: #f4f4f1; --bg-3: #ebebe6; --ink: #111110; --ink-2: #55544f; --muted: #8b8a84;
    --line: #e6e5df; --ring: rgba(17,17,16,.08); --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.12);
    --accent: #2a78d6;
    --lancar: #0ca30c; --ramai: #f2a300; --padat: #d03b3b; --offline: #b9b7af;
    --radius: 20px; --panel-w: 400px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-2); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #map { position: fixed; inset: 0; }

  /* Panel: floating card on desktop, bottom sheet on phones */
  .panel { position: fixed; z-index: 10; top: 16px; left: 16px; bottom: 16px; width: var(--panel-w);
    background: var(--bg); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .grab { display: none; }
  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .pad { padding: 0 20px; }
  .view { animation: in .22s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 4px; }
  h1 { font-size: 19px; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--padat);
    background: #fdecec; border-radius: 999px; padding: 3px 9px; vertical-align: 2px; margin-left: 6px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--padat); animation: blink 1.6s infinite; }
  .live.stale { color: var(--ink-2); background: var(--bg-2); } .live.stale i { background: var(--muted); animation: none; }
  @keyframes blink { 50% { opacity: .25; } }
  .sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }

  .search { position: relative; margin: 14px 20px 12px; }
  .search input { width: 100%; height: 44px; border: 0; border-radius: 12px; background: var(--bg-2); padding: 0 40px 0 40px;
    font: inherit; font-size: 15px; color: var(--ink); outline: none; transition: box-shadow .15s; }
  .search input:focus { box-shadow: 0 0 0 2px var(--accent); background: var(--bg); }
  .search svg { position: absolute; left: 13px; top: 13px; color: var(--muted); }
  .search .x { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: none; }

  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 20px 14px; }
  .lv { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 10px 10px 9px; text-align: left; transition: all .15s; }
  .lv:hover { border-color: var(--bg-3); background: var(--bg-2); }
  .lv[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .lv b { display: block; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .lv span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

  .tabs { display: flex; gap: 4px; margin: 0 20px; padding: 4px; background: var(--bg-2); border-radius: 12px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px 0; font-weight: 600; color: var(--ink-2); transition: all .15s; }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .list { list-style: none; margin: 6px 0 16px; padding: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 20px; cursor: pointer; transition: background .12s; }
  .row:hover, .row:focus-visible { background: var(--bg-2); outline: none; }
  .row .meta { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .src { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .count { text-align: right; font-variant-numeric: tabular-nums; }
  .row .count b { display: block; font-size: 16px; }
  .row .count small { color: var(--muted); font-size: 11px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--bg-2); white-space: nowrap; }
  .section-title { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 16px 20px 4px; }
  .empty { color: var(--muted); padding: 24px 20px; text-align: center; }
  .more { display: block; margin: 0 20px 16px; width: calc(100% - 40px); border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px; font-weight: 600; }

  /* Detail */
  .back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--bg-2); border-radius: 999px; padding: 6px 12px 6px 8px; font-weight: 600; margin: 16px 20px 0; }
  .dhead { padding: 12px 20px 0; }
  .dhead h2 { margin: 0; font-size: 18px; line-height: 1.3; }
  .dhead .src { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .state { display: flex; align-items: center; gap: 12px; margin: 14px 20px 0; padding: 14px; border-radius: 16px; background: var(--bg-2); }
  .state .big { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .state .txt { font-size: 13px; color: var(--ink-2); }
  .media { position: relative; margin: 14px 20px 0; border-radius: 16px; overflow: hidden; background: #0d0d0c; aspect-ratio: 16 / 9; }
  .media video, .media img, .media canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .media .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #c3c2b7; font-size: 13px; text-align: center; padding: 16px; }
  .mtabs { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); z-index: 2; }
  .mtabs button { border: 0; background: none; color: #ddd; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 7px; }
  .mtabs button[aria-selected="true"] { background: #fff; color: #111; }
  .stamp { position: absolute; right: 10px; bottom: 10px; z-index: 2; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); border-radius: 6px; padding: 2px 7px; }
  .card { margin: 14px 20px 0; padding: 14px; border: 1px solid var(--line); border-radius: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; }
  .note { color: var(--muted); font-size: 12px; margin: 12px 20px 20px; }
  .chart { position: relative; height: 130px; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 5px 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 3; }

  /* System status */
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 13px; }
  .kv dt { color: var(--ink-2); } .kv dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .srcrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; margin-bottom: 8px; }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  /* Floating map chrome */
  .legend { position: fixed; z-index: 5; right: 16px; bottom: 44px; background: var(--bg); border-radius: 14px; box-shadow: var(--shadow);
    padding: 10px 12px; display: flex; gap: 12px; font-size: 12px; font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .maplibregl-ctrl-group { border-radius: 12px !important; box-shadow: var(--shadow) !important; overflow: hidden; }
  .maplibregl-ctrl-group button { width: 36px; height: 36px; }
  .maplibregl-popup-content { border-radius: 12px; padding: 8px 10px; box-shadow: var(--shadow); font: 12px/1.4 system-ui, sans-serif; }
  .maplibregl-popup-tip { display: none; }

  @media (max-width: 767px) {
    .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: var(--sheet, 42vh); border-radius: 20px 20px 0 0;
      transition: height .28s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom); }
    .panel.dragging { transition: none; }
    .grab { display: block; flex: none; height: 22px; cursor: grab; touch-action: none; }
    .grab i { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--bg-3); margin: 9px auto 0; }
    .head { padding-top: 4px; }
    .legend { top: 12px; right: 12px; bottom: auto; padding: 8px 10px; gap: 9px; font-size: 11px; }
    .maplibregl-ctrl-top-right { top: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { *, .view { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="map" aria-label="Peta kamera lalu lintas"></div>

<aside class="panel" id="panel" aria-label="Kondisi lalu lintas">
  <div class="grab" id="grab" aria-hidden="true"><i></i></div>
  <div class="scroll" id="scroll">
    <section id="home" class="view">
      <div class="head">
        <div>
          <h1>Lalu Lintas Jabodetabek <span class="live stale" id="live"><i></i>Live</span></h1>
          <div class="sub" id="sub">Memuat kamera…</div>
        </div>
      </div>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari jalan, tol, atau kamera" autocomplete="off" aria-label="Cari kamera">
        <button class="x" id="qx" aria-label="Hapus pencarian">✕</button>
      </div>
      <div class="levels" id="levels" role="group" aria-label="Saring menurut kondisi"></div>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="list">Kamera</button>
        <button role="tab" aria-selected="false" data-tab="system">Status sistem</button>
      </div>
      <div id="tab-list"></div>
      <div id="tab-system" hidden></div>
    </section>
    <section id="detail" class="view" hidden></section>
  </div>
</aside>

<div class="legend" aria-hidden="true">
  <span><i class="dot" style="background:var(--lancar)"></i>Lancar</span>
  <span><i class="dot" style="background:var(--ramai)"></i>Ramai</span>
  <span><i class="dot" style="background:var(--padat)"></i>Padat</span>
  <span><i class="dot" style="background:var(--offline)"></i>Offline</span>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat('id-ID');
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
const ago = (ts, now) => { const m = Math.round((now - ts) / 60); return m < 1 ? 'baru saja' : m < 60 ? `${m} menit lalu` : `${Math.round(m / 60)} jam lalu`; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const OPERATORS = { jm: 'Jasa Marga', hk: 'Hutama Karya', cmnp: 'CMNP' };
const srcName = (s) => s.replace(/^BPJT Kementerian PU \((.+)\)$/, (_, c) => `Tol · ${OPERATORS[c] ?? c}`);
// Portal names are shouty and carry the owning agency ("JKP SATPOL PP SIMPANG JL. MH. THAMRIN C09 CCTV-02").
const KEEP = new Set(['MH.', 'KH.', 'JPO', 'UOB', 'KM', 'GT', 'ATP', 'JORR', 'JORRS', 'MBZ', 'KB', 'TB', 'S.', 'CCTV', 'II', 'III']);
const pretty = (n) => n
  .replace(/^JK[PBTSU]\s+(POLDA|POLRI|DISHUB|DBM|SATPOL\s?-?PP|SATPOLPP)\s+/, '')
  .replace(/\s*\bCCTV-?0?(\d+)$/, ' · kamera $1')
  .split(' ').map((w) => /\d/.test(w) || KEEP.has(w) ? w : w === 'JL.' || w === 'JL' ? 'Jl.' : w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
const LEVEL = {
  padat: { label: 'Padat', color: '#d03b3b', rank: 0 },
  ramai: { label: 'Ramai', color: '#f2a300', rank: 1 },
  lancar: { label: 'Lancar', color: '#0ca30c', rank: 2 },
  offline: { label: 'Offline', color: '#b9b7af', rank: 3 },
};
const badge = (lv) => `<span class="badge"><i class="dot" style="background:${LEVEL[lv].color}"></i>${LEVEL[lv].label}</span>`;
const isMobile = () => matchMedia('(max-width: 767px)').matches;

// Browser cache: render the last response instantly, then refresh. HTTP Cache-Control covers repeat fetches.
const cache = {
  get(k) { try { return JSON.parse(localStorage.getItem('lalin:' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('lalin:' + k, JSON.stringify(v)); } catch {} },
};
async function load(path, key) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path} ${res.status}`);
  const data = await res.json();
  if (key) cache.set(key, data);
  return data;
}

let cams = [], summary = null, filter = null, shown = 60, selected = null, map, mapReady = false;
const now = () => summary?.now ?? Math.floor(Date.now() / 1000);

// ---------- home ----------
function renderHome() {
  const live = cams.filter((c) => c.level !== 'offline');
  const last = summary?.last_pass;
  const fresh = last && now() - last.ts < 15 * 60;
  $('live').className = 'live' + (fresh ? '' : ' stale');
  $('sub').textContent = last
    ? `${fmt.format(live.length)} kamera aktif · diperbarui ${ago(last.ts, now())}`
    : 'Belum ada data';

  const count = (lv) => cams.filter((c) => c.level === lv).length;
  $('levels').innerHTML = ['padat', 'ramai', 'lancar', 'offline'].map((lv) => `
    <button class="lv" data-lv="${lv}" aria-pressed="${filter === lv}">
      <b>${fmt.format(count(lv))}</b><span><i class="dot" style="background:${LEVEL[lv].color}"></i>${LEVEL[lv].label}</span>
    </button>`).join('');
  renderList();
}

function visible() {
  const q = $('q').value.trim().toLowerCase();
  return cams.filter((c) => (!filter || c.level === filter) && (filter === 'offline' || c.level !== 'offline' || q)
      && (!q || `${c.name} ${pretty(c.name)} ${srcName(c.source)}`.toLowerCase().includes(q)))
    .sort((a, b) => LEVEL[a.level].rank - LEVEL[b.level].rank || (b.vehicles ?? -1) - (a.vehicles ?? -1));
}

function renderList() {
  const rows = visible();
  const busy = !filter && !$('q').value.trim() ? rows.filter((c) => c.level === 'padat' || c.level === 'ramai') : [];
  const rest = busy.length ? rows.filter((c) => !busy.includes(c)) : rows;
  const row = (c) => `
    <li class="row" tabindex="0" data-id="${esc(c.id)}">
      <div class="meta"><div class="name">${esc(pretty(c.name))}</div><div class="src">${esc(srcName(c.source))}</div></div>
      ${c.level === 'offline' ? badge('offline') : `<div class="count"><b>${c.vehicles}</b><small>${c.avg ? `biasanya ${fmt.format(c.avg)}` : 'kendaraan'}</small></div>${badge(c.level)}`}
    </li>`;
  $('tab-list').innerHTML = !rows.length ? '<div class="empty">Tidak ada kamera yang cocok.</div>' : `
    ${busy.length ? `<div class="section-title">Ramai dan padat sekarang</div><ul class="list">${busy.map(row).join('')}</ul>` : ''}
    <div class="section-title">${busy.length ? 'Kamera lain' : filter ? LEVEL[filter].label : 'Semua kamera'}</div>
    <ul class="list">${rest.slice(0, shown).map(row).join('')}</ul>
    ${rest.length > shown ? `<button class="more" id="more">Tampilkan ${fmt.format(Math.min(60, rest.length - shown))} lagi</button>` : ''}`;
  $('qx').style.display = $('q').value ? 'block' : 'none';
}

$('levels').addEventListener('click', (e) => {
  const b = e.target.closest('.lv'); if (!b) return;
  filter = filter === b.dataset.lv ? null : b.dataset.lv; shown = 60;
  renderHome(); updateMap();
});
$('q').addEventListener('input', () => { shown = 60; renderList(); });
$('qx').addEventListener('click', () => { $('q').value = ''; renderList(); $('q').focus(); });
$('tab-list').addEventListener('click', (e) => {
  if (e.target.id === 'more') { shown += 60; return renderList(); }
  const r = e.target.closest('.row'); if (r) select(r.dataset.id, true);
});
$('tab-list').addEventListener('keydown', (e) => { const r = e.target.closest('.row'); if (r && e.key === 'Enter') select(r.dataset.id, true); });
document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
  $('tab-list').hidden = b.dataset.tab !== 'list';
  $('tab-system').hidden = b.dataset.tab !== 'system';
  if (b.dataset.tab === 'system') renderSystem();
});

// ---------- system status (monitoring) ----------
function renderSystem() {
  const s = summary; if (!s?.last_pass) { $('tab-system').innerHTML = '<div class="empty">Belum ada data.</div>'; return; }
  const p = s.last_pass, age = (s.now - p.ts) / 60;
  const st = age < 10 ? ['lancar', 'Collector jalan normal'] : age < 30 ? ['ramai', 'Collector terlambat'] : ['padat', 'Collector berhenti'];
  const mb = (n) => n > 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.round(n / 1e3)} KB`;
  const r = s.storage.retention;
  $('tab-system').innerHTML = `
    <div class="card"><span class="badge"><i class="dot" style="background:${LEVEL[st[0]].color}"></i>${st[1]}</span>
      <dl class="kv" style="margin-top:12px">
        <dt>Putaran terakhir</dt><dd>${clock(p.ts)} · ${p.seconds} detik</dd>
        <dt>Kamera online</dt><dd>${fmt.format(p.online)} / ${fmt.format(p.total)}</dd>
        <dt>Kendaraan terhitung</dt><dd>${fmt.format(p.vehicles)}</dd>
      </dl></div>
    <div class="card"><h3>Kamera online, 24 jam</h3><div class="chart" id="sys-chart"></div></div>
    <div class="card"><h3>Penyimpanan server</h3><dl class="kv">
        <dt>Ukuran database</dt><dd>${mb(s.storage.bytes)}</dd>
        <dt>Data per 5 menit (${r.RAW_DAYS} hari)</dt><dd>${fmt.format(s.storage.readings)}</dd>
        <dt>Ringkasan per jam (${r.HOURLY_DAYS} hari)</dt><dd>${fmt.format(s.storage.hourly)}</dd>
        <dt>Log putaran (${r.PASSES_DAYS} hari)</dt><dd>${fmt.format(s.storage.passes)}</dd>
        <dt>Pembersihan otomatis</dt><dd>${s.storage.last_maintain ? ago(s.storage.last_maintain, s.now) : 'belum'}</dd>
      </dl><div class="note" style="margin:10px 0 0">Server hanya menyimpan angka. Video dan gambar diambil langsung dari pemilik kamera.</div></div>
    <div class="card"><h3>Sumber kamera</h3>${s.sources.map((x) => `
      <div class="srcrow"><span>${esc(srcName(x.source))}</span><b>${x.online}/${x.total}</b>
      <div class="bar"><i style="width:${x.total ? x.online / x.total * 100 : 0}%"></i></div></div>`).join('')}</div>
    <div class="note">Sumber: CCTV Publik Pemprov DKI Jakarta, CCTV jalan tol BPJT Kementerian PU, CCTV Bina Marga.
      Kode: <a href="https://github.com/valentinodeenata/traffic-cctv-tracker" style="color:var(--accent)">traffic-cctv-tracker</a>.</div>`;
  lineChart($('sys-chart'), s.passes.map((x) => [x.ts, x.online]), 'kamera online');
}

// ---------- detail ----------
let hls = null, detailToken = 0;
function stopVideo() { if (hls) { hls.destroy(); hls = null; } }

async function select(id, fly) {
  const c = cams.find((x) => x.id === id); if (!c) return;
  selected = id; history.replaceState(null, '', '#' + encodeURIComponent(id));
  stopVideo();
  const token = ++detailToken;
  $('home').hidden = true;
  const d = $('detail'); d.hidden = false;
  d.innerHTML = `
    <button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Kembali</button>
    <div class="dhead"><h2>${esc(pretty(c.name))}</h2><div class="src">${esc(srcName(c.source))}${c.approx ? ' · lokasi perkiraan' : ''}</div></div>
    <div class="state">
      ${c.level === 'offline' ? `<div class="txt">Kamera ini tidak bisa diambil gambarnya${c.last_ok ? ` sejak ${ago(c.last_ok, now())}` : ''}.</div>` : `
      <div class="big">${c.vehicles}</div>
      <div style="flex:1"><div style="margin-bottom:3px">${badge(c.level)}</div>
        <div class="txt">kendaraan terlihat${c.avg ? `, biasanya ${fmt.format(c.avg)}` : ''}</div></div>`}
    </div>
    <div class="media" id="media">
      <div class="mtabs" role="tablist"><button data-m="live" aria-selected="true">Live</button><button data-m="ai" aria-selected="false">Deteksi AI</button></div>
      <div class="msg">Memuat video…</div>
    </div>
    <div class="card"><h3>Kendaraan per 5 menit, 24 jam</h3><div class="chart" id="d-chart"><div class="empty">Memuat…</div></div></div>
    <div class="note">Kondisi diperkirakan dari jumlah kendaraan yang terlihat kamera dibanding rata-rata kamera ini.
      Akurasi turun saat malam, hujan, atau saat kamera menyorot area parkir.</div>`;
  $('back').onclick = closeDetail;
  $('scroll').scrollTop = 0;
  if (isMobile()) setSheet(0.62);
  if (fly && map) map.flyTo({ center: [c.lng, c.lat], zoom: Math.max(map.getZoom(), 14), speed: 1.4, essential: true });
  updateMap();

  const media = $('media');
  media.querySelector('.mtabs').onclick = (e) => { const b = e.target.closest('button'); if (b) showMedia(c, b.dataset.m, info); };
  let info = null;
  showMedia(c, 'live', null);
  try { info = await load(`/api/camera?id=${encodeURIComponent(id)}`); } catch { return; }
  if (token !== detailToken) return;
  const raw = info.raw.map((r) => [r.ts, r.vehicles ?? 0]);
  lineChart($('d-chart'), raw, 'kendaraan', c.avg || null);
  media._info = info;
}

function showMedia(c, mode, info) {
  const media = $('media'); if (!media) return;
  info = info ?? media._info;
  media.querySelectorAll('.mtabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.m === mode));
  media.querySelectorAll('video, img, canvas, .msg, .stamp').forEach((el) => el.remove());
  stopVideo();
  const msg = (t) => media.insertAdjacentHTML('beforeend', `<div class="msg">${t}</div>`);
  if (mode === 'ai') {
    if (!c.frame) return msg('Belum ada frame untuk kamera ini.');
    const img = new Image();
    img.alt = `Frame terakhir ${c.name} dengan kotak deteksi kendaraan`;
    img.src = `/api/frame?id=${encodeURIComponent(c.id)}`;
    const cv = document.createElement('canvas');
    media.append(img, cv);
    const draw = async () => {
      if (!info) info = media._info ?? await load(`/api/camera?id=${encodeURIComponent(c.id)}`).catch(() => null);
      const f = info?.frame; if (!f) return;
      const r = media.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      cv.width = r.width * dpr; cv.height = r.height * dpr;
      const s = Math.min(r.width / f.w, r.height / f.h), ox = (r.width - f.w * s) / 2, oy = (r.height - f.h * s) / 2;
      const g = cv.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2; g.font = '600 11px system-ui, sans-serif';
      for (const b of f.boxes) {
        const x = ox + b.x1 * f.w * s, y = oy + b.y1 * f.h * s, w = (b.x2 - b.x1) * f.w * s, h = (b.y2 - b.y1) * f.h * s;
        g.strokeStyle = '#3ee07a'; g.strokeRect(x, y, w, h);
        const label = { car: 'mobil', motorcycle: 'motor', bus: 'bus', truck: 'truk' }[b.cls] ?? b.cls;
        const tw = g.measureText(label).width + 8;
        g.fillStyle = '#3ee07a'; g.fillRect(x - 1, y - 16, tw, 16);
        g.fillStyle = '#062b12'; g.fillText(label, x + 3, y - 4);
      }
      media.insertAdjacentHTML('beforeend', `<div class="stamp">${f.boxes.length} kendaraan · pukul ${clock(f.ts)}</div>`);
    };
    img.onload = draw;
    img.onerror = () => { img.remove(); cv.remove(); msg('Frame tidak tersedia.'); };
    return;
  }
  // Live: play the owner's stream directly in the browser; fall back to the AI frame when it won't play.
  const fallback = (why) => { if (media.isConnected && c.frame) showMedia(c, 'ai', info); else msg(why); };
  if (c.level === 'offline') return msg('Kamera sedang offline di server pemiliknya.');
  if (!c.stream.startsWith('https:')) return fallback('Video ini tidak bisa diputar di halaman https.');
  const v = document.createElement('video');
  Object.assign(v, { muted: true, autoplay: true, playsInline: true, controls: false });
  v.setAttribute('aria-label', `Video live ${c.name}`);
  media.append(v);
  media.insertAdjacentHTML('beforeend', '<div class="stamp">Live dari pemilik kamera</div>');
  const timer = setTimeout(() => fallback('Video live tidak bisa dimuat.'), 9000);
  v.addEventListener('playing', () => clearTimeout(timer), { once: true });
  if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = c.stream; }
  else if (window.Hls?.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, maxBufferLength: 10 });
    hls.on(Hls.Events.ERROR, (_, e) => { if (e.fatal) { clearTimeout(timer); fallback('Video live tidak bisa dimuat.'); } });
    hls.loadSource(c.stream); hls.attachMedia(v);
  } else { clearTimeout(timer); fallback('Browser ini tidak bisa memutar video live.'); }
}

function closeDetail() {
  stopVideo(); detailToken++;
  selected = null; history.replaceState(null, '', location.pathname);
  $('detail').hidden = true; $('home').hidden = false;
  if (isMobile()) setSheet(0.42);
  updateMap();
}

// ---------- chart (single series + optional "biasanya" reference) ----------
function lineChart(el, points, unit, ref) {
  if (!el) return;
  const w = el.clientWidth, h = el.clientHeight, pad = { l: 28, r: 6, t: 8, b: 20 };
  if (!points.length) { el.innerHTML = '<div class="empty">Belum ada data.</div>'; return; }
  const t0 = points[0][0], t1 = Math.max(points.at(-1)[0], t0 + 1);
  const top = niceMax(Math.max(ref ?? 0, ...points.map((p) => p[1]), 1));
  const x = (t) => pad.l + (t - t0) / (t1 - t0) * (w - pad.l - pad.r);
  const y = (v) => h - pad.b - v / top * (h - pad.t - pad.b);
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const area = `${path}L${x(points.at(-1)[0])},${y(0)}L${x(t0)},${y(0)}Z`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${unit} 24 jam terakhir">
    <defs><linearGradient id="g${el.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a78d6" stop-opacity=".18"/><stop offset="1" stop-color="#2a78d6" stop-opacity="0"/></linearGradient></defs>
    ${[0, top / 2, top].map((v) => `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? '#efeee9' : '#d9d8d1'}"/>
      <text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#8b8a84">${fmt.format(v)}</text>`).join('')}
    ${[t0, t1].map((t, i) => `<text x="${x(t)}" y="${h - 4}" text-anchor="${i ? 'end' : 'start'}" font-size="10" fill="#8b8a84">${clock(t)}</text>`).join('')}
    ${ref ? `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(ref)}" y2="${y(ref)}" stroke="#8b8a84" stroke-dasharray="4 4"/>
      <text x="${w - pad.r}" y="${y(ref) - 5}" text-anchor="end" font-size="10" fill="#55544f">biasanya ${fmt.format(ref)}</text>` : ''}
    <path d="${area}" fill="url(#g${el.id})"/>
    <path d="${path}" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.length < 3 ? points.map((p) => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="#2a78d6" stroke="#fff" stroke-width="2"/>`).join('') : ''}
    <line class="xh" y1="${pad.t}" y2="${h - pad.b}" stroke="#c3c2b7" visibility="hidden"/>
    <circle class="pt" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2" visibility="hidden"/>
    <rect x="${pad.l}" y="0" width="${w - pad.l - pad.r}" height="${h}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh'), pt = svg.querySelector('.pt');
  svg.addEventListener('pointermove', (e) => {
    const mx = e.clientX - svg.getBoundingClientRect().left;
    const p = points.reduce((a, b) => Math.abs(x(b[0]) - mx) < Math.abs(x(a[0]) - mx) ? b : a);
    const px = x(p[0]), py = y(p[1]);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    pt.setAttribute('cx', px); pt.setAttribute('cy', py); pt.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${fmt.format(p[1])}</b> ${unit} · ${clock(p[0])}`; tip.style.display = 'block';
    tip.style.left = `${Math.min(Math.max(0, px - tip.offsetWidth / 2), w - tip.offsetWidth)}px`;
    tip.style.top = `${Math.max(0, py - tip.offsetHeight - 10)}px`;
  });
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); pt.setAttribute('visibility', 'hidden'); });
}
function niceMax(v) { const p = 10 ** Math.floor(Math.log10(v)); return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v); }

// ---------- map ----------
function geojson() {
  return { type: 'FeatureCollection', features: cams.filter((c) => c.lat != null && (!filter || c.level === filter)).map((c) => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: [c.lng, c.lat] },
    properties: { id: c.id, name: c.name, level: c.level, vehicles: c.vehicles ?? -1, rank: 3 - LEVEL[c.level].rank, sel: c.id === selected ? 1 : 0 },
  })) };
}
function updateMap() { if (mapReady) map.getSource('cams').setData(geojson()); }
function mapPadding() {
  return isMobile() ? { top: 0, left: 0, right: 0, bottom: window.innerHeight * sheet } : { top: 0, left: 432, right: 0, bottom: 0 };
}

function initMap() {
  if (!window.maplibregl) return;
  map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/positron',
    center: [106.83, -6.22], zoom: 10.3, minZoom: 8, maxZoom: 18, attributionControl: { compact: true }, pitchWithRotate: false });
  map.setPadding(mapPadding());
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: false } }), 'top-right');
  map.on('load', () => {
    map.addSource('cams', { type: 'geojson', data: geojson() });
    const color = ['match', ['get', 'level'], 'padat', LEVEL.padat.color, 'ramai', LEVEL.ramai.color, 'lancar', LEVEL.lancar.color, LEVEL.offline.color];
    map.addLayer({ id: 'pulse', type: 'circle', source: 'cams', filter: ['==', ['get', 'level'], 'padat'],
      paint: { 'circle-color': LEVEL.padat.color, 'circle-radius': 10, 'circle-opacity': 0.25 } });
    map.addLayer({ id: 'cams', type: 'circle', source: 'cams',
      layout: { 'circle-sort-key': ['+', ['get', 'rank'], ['*', ['get', 'sel'], 10]] },
      paint: {
        'circle-color': color,
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, ['case', ['==', ['get', 'level'], 'offline'], 2.5, 4.5], 14,
          ['case', ['==', ['get', 'sel'], 1], 11, ['==', ['get', 'level'], 'offline'], 5, 8]],
        'circle-stroke-color': ['case', ['==', ['get', 'sel'], 1], '#111110', '#ffffff'],
        'circle-stroke-width': ['case', ['==', ['get', 'sel'], 1], 3, 1.5],
      } });
    mapReady = true;
    // Pulse the "padat" markers
    const t0 = performance.now();
    const tick = (t) => {
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const k = ((t - t0) % 1800) / 1800;
        map.setPaintProperty('pulse', 'circle-radius', 8 + k * 16);
        map.setPaintProperty('pulse', 'circle-opacity', 0.35 * (1 - k));
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    const hover = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });
    map.on('mousemove', 'cams', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const p = e.features[0].properties;
      hover.setLngLat(e.features[0].geometry.coordinates)
        .setHTML(`<b>${esc(pretty(p.name))}</b><br>${LEVEL[p.level].label}${p.vehicles >= 0 ? ` · ${p.vehicles} kendaraan` : ''}`).addTo(map);
    });
    map.on('mouseleave', 'cams', () => { map.getCanvas().style.cursor = ''; hover.remove(); });
    map.on('click', 'cams', (e) => { hover.remove(); select(e.features[0].properties.id, true); });
  });
}

// ---------- bottom sheet (phones) ----------
let sheet = 0.42;
function setSheet(f) {
  sheet = Math.min(0.92, Math.max(0.14, f));
  $('panel').style.setProperty('--sheet', `${sheet * 100}vh`);
  if (map) map.setPadding(mapPadding());
}
(() => {
  const grab = $('grab'); let startY = 0, startF = 0;
  grab.addEventListener('pointerdown', (e) => { startY = e.clientY; startF = sheet; grab.setPointerCapture(e.pointerId); $('panel').classList.add('dragging'); });
  grab.addEventListener('pointermove', (e) => { if (grab.hasPointerCapture(e.pointerId)) setSheet(startF + (startY - e.clientY) / innerHeight); });
  grab.addEventListener('pointerup', (e) => {
    $('panel').classList.remove('dragging');
    if (Math.abs(e.clientY - startY) < 6) return setSheet(sheet < 0.5 ? 0.85 : 0.42);
    setSheet([0.14, 0.42, 0.85].reduce((a, b) => Math.abs(b - sheet) < Math.abs(a - sheet) ? b : a));
  });
})();

// ---------- data ----------
function apply(s, c) {
  summary = s; cams = c;
  renderHome();
  if (!$('tab-system').hidden) renderSystem();
  updateMap();
}
async function refresh() {
  try {
    const [s, c] = await Promise.all([load('/api/summary', 'summary'), load('/api/cameras', 'cameras')]);
    apply(s, c);
  } catch {
    $('sub').textContent = 'Server tidak menjawab, menampilkan data terakhir';
  }
}

initMap();
const cs = cache.get('summary'), cc = cache.get('cameras');
if (cs && cc) apply(cs, cc);
refresh().then(() => { const id = decodeURIComponent(location.hash.slice(1)); if (id) select(id, true); });
setInterval(() => { if (!document.hidden) refresh(); }, 60000);
addEventListener('resize', () => { if (map) map.setPadding(mapPadding()); });
</script>
</body>
